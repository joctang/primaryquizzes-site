<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">Simple school map for following pathways</title><desc id="desc">A north-up map with a 4 by 3 path of equal squares. Home is bottom left, Hall beside it, Garden and Library are in the middle, and the Oval and Playground are on the right.</desc>
  <rect width="760" height="470" rx="24" fill="#f4f8ff"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#183153">A simple school map</text>
  <g fill="#ffffff" stroke="#73869a" stroke-width="3"><rect x="70" y="85" width="145" height="105"/><rect x="215" y="85" width="145" height="105"/><rect x="360" y="85" width="145" height="105"/><rect x="505" y="85" width="145" height="105"/><rect x="70" y="190" width="145" height="105"/><rect x="215" y="190" width="145" height="105"/><rect x="360" y="190" width="145" height="105"/><rect x="505" y="190" width="145" height="105"/><rect x="70" y="295" width="145" height="105"/><rect x="215" y="295" width="145" height="105"/><rect x="360" y="295" width="145" height="105"/><rect x="505" y="295" width="145" height="105"/></g>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#183153"><text x="142" y="143">Path</text><text x="287" y="143">Path</text><text x="432" y="143">Path</text><text x="577" y="143">Oval</text><text x="142" y="247">Tree</text><text x="287" y="247">Garden</text><text x="432" y="247">Library</text><text x="577" y="247">Path</text><text x="142" y="352">Home</text><text x="287" y="352">Hall</text><text x="432" y="352">Path</text><text x="577" y="352">Playground</text></g>
  <path d="M700 150 V90 M688 105 L700 88 L712 105" fill="none" stroke="#245c9b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="693" y="173" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#245c9b">N</text>
  <text x="84" y="438" font-family="Arial,sans-serif" font-size="18" fill="#52677f">Move along the paths. One square is one step. The top of the map is north.</text>
</svg>
