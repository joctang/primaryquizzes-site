<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">A repeating tessellation made from transformed triangles</title><desc id="desc">A grid of alternating blue and orange triangles fits together without gaps or overlaps.</desc>
  <rect width="720" height="360" rx="24" fill="#f4f8ff"/><text x="30" y="45" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183153">A tessellation: repeated shapes, no gaps</text>
  <g stroke="#183153" stroke-width="2"><path d="M80 90 L180 90 L130 175 Z" fill="#91c8ff"/><path d="M80 90 L130 175 L30 175 Z" fill="#f6c85f"/><path d="M180 90 L280 90 L230 175 Z" fill="#91c8ff"/><path d="M180 90 L230 175 L130 175 Z" fill="#f6c85f"/><path d="M280 90 L380 90 L330 175 Z" fill="#91c8ff"/><path d="M280 90 L330 175 L230 175 Z" fill="#f6c85f"/>
  <path d="M30 175 L130 175 L80 260 Z" fill="#91c8ff"/><path d="M30 175 L80 260 L-20 260 Z" fill="#f6c85f"/><path d="M130 175 L230 175 L180 260 Z" fill="#91c8ff"/><path d="M130 175 L180 260 L80 260 Z" fill="#f6c85f"/><path d="M230 175 L330 175 L280 260 Z" fill="#91c8ff"/><path d="M230 175 L280 260 L180 260 Z" fill="#f6c85f"/>
  <path d="M430 90 L530 90 L480 175 Z" fill="#91c8ff"/><path d="M430 90 L480 175 L380 175 Z" fill="#f6c85f"/><path d="M530 90 L630 90 L580 175 Z" fill="#91c8ff"/><path d="M530 90 L580 175 L480 175 Z" fill="#f6c85f"/><path d="M630 90 L730 90 L680 175 Z" fill="#91c8ff"/><path d="M630 90 L680 175 L580 175 Z" fill="#f6c85f"/>
  <path d="M380 175 L480 175 L430 260 Z" fill="#91c8ff"/><path d="M380 175 L430 260 L330 260 Z" fill="#f6c85f"/><path d="M480 175 L580 175 L530 260 Z" fill="#91c8ff"/><path d="M480 175 L530 260 L430 260 Z" fill="#f6c85f"/><path d="M580 175 L680 175 L630 260 Z" fill="#91c8ff"/><path d="M580 175 L630 260 L530 260 Z" fill="#f6c85f"/></g>
  <text x="150" y="315" font-family="Arial,sans-serif" font-size="20" fill="#183153">Translations and turns repeat the same-size triangles.</text>
</svg>
