<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" role="img" aria-labelledby="title desc">
  <title id="title">Books read by students</title>
  <desc id="desc">A column graph shows frequencies of one, four, five, three and two students for zero, one, two, three and four books respectively.</desc>
  <rect width="360" height="250" rx="14" fill="#f8fafc"/>
  <text x="180" y="22" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">Books read by students</text>
  <text x="18" y="123" text-anchor="middle" transform="rotate(-90 18 123)" font-family="Arial,sans-serif" font-size="12" fill="#334155">Number of students</text>
  <g stroke="#cbd5e1" stroke-width="1"><path d="M54 190h286M54 165h286M54 140h286M54 115h286M54 90h286M54 65h286M54 40h286"/></g>
  <g font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="end"><text x="48" y="194">0</text><text x="48" y="169">1</text><text x="48" y="144">2</text><text x="48" y="119">3</text><text x="48" y="94">4</text><text x="48" y="69">5</text><text x="48" y="44">6</text></g>
  <g fill="#60a5fa"><rect x="78" y="165" width="34" height="25"/><rect x="132" y="90" width="34" height="100"/><rect x="186" y="65" width="34" height="125"/><rect x="240" y="115" width="34" height="75"/><rect x="294" y="140" width="34" height="50"/></g>
  <g font-family="Arial,sans-serif" font-size="12" fill="#334155" text-anchor="middle"><text x="95" y="210">0</text><text x="149" y="210">1</text><text x="203" y="210">2</text><text x="257" y="210">3</text><text x="311" y="210">4</text><text x="185" y="232">Number of books</text></g>
</svg>
