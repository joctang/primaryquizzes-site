<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Measuring a book with equal cubes</title><desc id="desc">Five same-sized cubes line up edge to edge along the length of a book.</desc>
  <rect width="720" height="300" rx="24" fill="#f4f8ff"/><text x="36" y="52" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#183153">Measure with equal units</text>
  <rect x="95" y="105" width="500" height="90" rx="12" fill="#f6c85f" stroke="#9b6b00" stroke-width="4"/><text x="300" y="158" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#503900">book</text>
  <g stroke="#245c9b" stroke-width="3" fill="#91c8ff"><rect x="95" y="210" width="100" height="54"/><rect x="195" y="210" width="100" height="54"/><rect x="295" y="210" width="100" height="54"/><rect x="395" y="210" width="100" height="54"/><rect x="495" y="210" width="100" height="54"/></g>
  <text x="242" y="290" font-family="Arial,sans-serif" font-size="21" fill="#183153">same size · no gaps · no overlaps</text>
</svg>
