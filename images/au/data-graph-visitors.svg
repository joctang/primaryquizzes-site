<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Daily visitors</title>
  <desc id="desc">Monday 150, Tuesday 180, Wednesday 250, Thursday 220 visitors.</desc>
  <rect width="640" height="300" rx="16" fill="#fff"/>
  <text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">Daily visitors</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e3a5f">
    <text x="24" y="91">Monday</text><text x="24" y="141">Tuesday</text><text x="24" y="191">Wednesday</text><text x="24" y="241">Thursday</text>
  </g>
  <g>
    <rect x="160" y="66" width="240" height="32" rx="7" fill="#287d8e"/><rect x="160" y="116" width="288" height="32" rx="7" fill="#e09f3e"/><rect x="160" y="166" width="400" height="32" rx="7" fill="#5f8d4e"/><rect x="160" y="216" width="352" height="32" rx="7" fill="#7276a8"/>
  </g>
