<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-labelledby="title">
  <title id="title">Waste sorting</title>
  <rect width="640" height="180" rx="16" fill="#fff"/>
  <text x="24" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">Waste sorting</text>
  <text x="24" y="116" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e3a5f">Recycled</text>
  <rect x="220" y="95" width="290" height="30" rx="7" fill="#287d8e"/>
  <text x="520" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1e3a5f">35 kg</text>
  <text x="24" y="168" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e3a5f">Not recycled</text>
  <rect x="220" y="147" width="124" height="30" rx="7" fill="#e09f3e"/>
  <text x="354" y="168" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1e3a5f">15 kg</text>
</svg>
