<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 110" role="img" aria-labelledby="title desc">
  <title id="title">Unmarked intervals between two mass readings</title>
  <desc id="desc">A scale labelled two hundred and eight hundred grams, divided into three equal intervals.</desc>
  <rect width="300" height="110" rx="14" fill="#f8fafc"/>
  <path d="M40 55h220" stroke="#334155" stroke-width="4"/>
  <g stroke="#334155" stroke-width="3"><path d="M40 39v32M113 43v24M187 43v24M260 39v32"/></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#334155" text-anchor="middle"><text x="40" y="96">200 g</text><text x="260" y="96">800 g</text></g>
</svg>
