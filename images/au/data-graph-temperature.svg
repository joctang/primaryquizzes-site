<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Daily temperature</title>
  <desc id="desc">Line graph from Monday to Thursday: Monday 18 degrees, Tuesday 23 degrees, Wednesday 17 degrees and Thursday 22 degrees Celsius.</desc>
  <rect width="640" height="360" rx="16" fill="#fff"/>
  <text x="28" y="38" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">Daily temperature</text>
  <text x="24" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a5f" transform="rotate(-90 24 206)">Temperature (°C)</text>
  <g stroke="#dce3ea" stroke-width="1" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526579">
    <line x1="100" y1="278" x2="580" y2="278"/><line x1="100" y1="238" x2="580" y2="238"/><line x1="100" y1="198" x2="580" y2="198"/><line x1="100" y1="158" x2="580" y2="158"/><line x1="100" y1="118" x2="580" y2="118"/><line x1="100" y1="78" x2="580" y2="78"/>
    <text x="75" y="283" stroke="none">0</text><text x="75" y="243" stroke="none">5</text><text x="75" y="203" stroke="none">10</text><text x="75" y="163" stroke="none">15</text><text x="75" y="123" stroke="none">20</text><text x="75" y="83" stroke="none">25</text>
  </g>
  <line x1="100" y1="286" x2="580" y2="286" stroke="#8293a4" stroke-width="2"/><line x1="100" y1="70" x2="100" y2="286" stroke="#8293a4" stroke-width="2"/>
  <polyline points="160,134 300,94 440,142 560,102" fill="none" stroke="#287d8e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#287d8e" stroke="#fff" stroke-width="3"><circle cx="160" cy="134" r="7"/><circle cx="300" cy="94" r="7"/><circle cx="440" cy="142" r="7"/><circle cx="560" cy="102" r="7"/></g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1e3a5f" text-anchor="middle"><text x="160" y="115">18°C</text><text x="300" y="75">23°C</text><text x="440" y="123">17°C</text><text x="560" y="83">22°C</text></g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1e3a5f" text-anchor="middle"><text x="160" y="316">Monday</text><text x="300" y="316">Tuesday</text><text x="440" y="316">Wednesday</text><text x="560" y="316">Thursday</text></g>
</svg>

