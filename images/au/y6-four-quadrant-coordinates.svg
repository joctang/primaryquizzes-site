<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
  <title id="title">Cartesian plane showing all four quadrants</title><desc id="desc">A labelled coordinate grid with x and y axes, positive and negative directions and a point at negative three, positive two in quadrant two.</desc>
  <rect width="420" height="420" rx="24" fill="#f4f8ff"/><g stroke="#c7d5e5" stroke-width="1"><path d="M60 60 V360 M100 60 V360 M140 60 V360 M180 60 V360 M220 60 V360 M260 60 V360 M300 60 V360 M340 60 V360 M60 60 H360 M60 100 H360 M60 140 H360 M60 180 H360 M60 220 H360 M60 260 H360 M60 300 H360 M60 340 H360"/></g><path d="M60 220 H360 M220 360 V60" stroke="#183153" stroke-width="4"/><path d="M350 212 L360 220 L350 228 M212 70 L220 60 L228 70" fill="none" stroke="#183153" stroke-width="4"/><text x="364" y="226" font-family="Arial,sans-serif" font-size="18" fill="#183153">x</text><text x="226" y="54" font-family="Arial,sans-serif" font-size="18" fill="#183153">y</text>
  <text x="278" y="100" font-family="Arial,sans-serif" font-size="18" fill="#52677f">I</text><text x="140" y="100" font-family="Arial,sans-serif" font-size="18" fill="#52677f">II</text><text x="140" y="325" font-family="Arial,sans-serif" font-size="18" fill="#52677f">III</text><text x="280" y="325" font-family="Arial,sans-serif" font-size="18" fill="#52677f">IV</text>
  <circle cx="100" cy="140" r="8" fill="#ef8354"/><text x="69" y="128" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#8b4527">(-3, 2)</text><text x="63" y="388" font-family="Arial,sans-serif" font-size="15" fill="#52677f">Each grid step = 1 unit</text>
</svg>
