<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Dot plots comparing two groups' course times</title>
  <desc id="desc">Two dot plots share a seconds scale from 14 to 28. Group A has times 18, 19, 19, 20, 20, 20, 21 and 22, so its mode is 20 and range is 4. Group B has one time each at 14, 16, 18, 20, 22, 24, 26 and 28, so its results are more spread out.</desc>
  <rect width="760" height="390" rx="18" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16324f">Time to complete the course (seconds)</text>
  <g stroke="#cbd5e1" stroke-width="1"><path d="M120 295H700M120 245H700M120 195H700M120 145H700M120 95H700"/></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#334155" text-anchor="middle"><text x="120" y="325">14</text><text x="161" y="325">15</text><text x="202" y="325">16</text><text x="243" y="325">17</text><text x="284" y="325">18</text><text x="325" y="325">19</text><text x="366" y="325">20</text><text x="407" y="325">21</text><text x="448" y="325">22</text><text x="489" y="325">23</text><text x="530" y="325">24</text><text x="571" y="325">25</text><text x="612" y="325">26</text><text x="653" y="325">27</text><text x="694" y="325">28</text></g>
  <g font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#16324f"><text x="20" y="135">Group A</text><text x="20" y="252">Group B</text></g>
  <g fill="#176b87" stroke="#fff" stroke-width="2">
    <circle cx="284" cy="145" r="9"/><circle cx="325" cy="145" r="9"/><circle cx="325" cy="120" r="9"/><circle cx="366" cy="145" r="9"/><circle cx="366" cy="120" r="9"/><circle cx="366" cy="95" r="9"/><circle cx="407" cy="145" r="9"/><circle cx="448" cy="145" r="9"/>
  </g>
  <g fill="#e9a858" stroke="#fff" stroke-width="2"><circle cx="120" cy="245" r="9"/><circle cx="202" cy="245" r="9"/><circle cx="284" cy="245" r="9"/><circle cx="366" cy="245" r="9"/><circle cx="448" cy="245" r="9"/><circle cx="530" cy="245" r="9"/><circle cx="612" cy="245" r="9"/><circle cx="694" cy="245" r="9"/></g>
  <text x="410" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Each dot represents one student</text>
</svg>
