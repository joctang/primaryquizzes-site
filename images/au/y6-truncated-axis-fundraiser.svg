<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" role="img" aria-labelledby="title desc">
  <title id="title">A column graph with a truncated vertical axis</title>
  <desc id="desc">A fundraiser graph shows 44 dollars in 2024 and 50 dollars in 2025, but the vertical axis starts at 40 rather than zero, which makes the difference look much larger.</desc>
  <rect width="620" height="360" rx="18" fill="#f8fafc"/>
  <text x="330" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#16324f">Fundraiser total shown in a graph</text>
  <g stroke="#cbd5e1" stroke-width="1.5"><path d="M100 300H560M100 260H560M100 220H560M100 180H560M100 140H560M100 100H560"/></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#334155" text-anchor="end"><text x="88" y="305">$40</text><text x="88" y="265">$42</text><text x="88" y="225">$44</text><text x="88" y="185">$46</text><text x="88" y="145">$48</text><text x="88" y="105">$50</text></g>
  <g fill="#efbd67"><rect x="190" y="220" width="95" height="80"/><rect x="385" y="100" width="95" height="200"/></g>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#16324f" text-anchor="middle"><text x="237" y="210">$44</text><text x="432" y="90">$50</text><text x="237" y="330">2024</text><text x="432" y="330">2025</text></g>
  <text x="25" y="195" transform="rotate(-90 25 195)" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">Amount raised</text>
  <text x="330" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#9a3412">Vertical axis starts at $40, not $0</text>
</svg>
