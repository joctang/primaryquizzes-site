<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 232" role="img" aria-labelledby="title">
  <title id="title">Fruit collected</title>
  <rect width="640" height="232" rx="16" fill="#fff"/>
  <text x="24" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">Fruit collected</text>
  <text x="24" y="116" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e3a5f">Apples</text>
  <rect x="220" y="95" width="193" height="30" rx="7" fill="#287d8e"/>
  <text x="423" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1e3a5f">10 kg</text>
  <text x="24" y="168" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e3a5f">Bananas</text>
  <rect x="220" y="147" width="290" height="30" rx="7" fill="#e09f3e"/>
  <text x="520" y="168" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1e3a5f">15 kg</text>
  <text x="24" y="220" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e3a5f">Pears</text>
  <rect x="220" y="199" width="97" height="30" rx="7" fill="#5f8d4e"/>
  <text x="327" y="220" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1e3a5f">5 kg</text>
</svg>
