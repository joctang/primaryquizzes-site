<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">A rectangular array shows why area is rows times columns</title><desc id="desc">A rectangle is covered with 4 rows of 7 equal square units, making 28 square units altogether.</desc>
  <rect width="600" height="360" rx="24" fill="#f4f8ff"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183153">Count square units by rows and columns</text>
  <g fill="#91c8ff" stroke="#245c9b" stroke-width="2"><rect x="120" y="90" width="48" height="48"/><rect x="168" y="90" width="48" height="48"/><rect x="216" y="90" width="48" height="48"/><rect x="264" y="90" width="48" height="48"/><rect x="312" y="90" width="48" height="48"/><rect x="360" y="90" width="48" height="48"/><rect x="408" y="90" width="48" height="48"/>
  <rect x="120" y="138" width="48" height="48"/><rect x="168" y="138" width="48" height="48"/><rect x="216" y="138" width="48" height="48"/><rect x="264" y="138" width="48" height="48"/><rect x="312" y="138" width="48" height="48"/><rect x="360" y="138" width="48" height="48"/><rect x="408" y="138" width="48" height="48"/>
  <rect x="120" y="186" width="48" height="48"/><rect x="168" y="186" width="48" height="48"/><rect x="216" y="186" width="48" height="48"/><rect x="264" y="186" width="48" height="48"/><rect x="312" y="186" width="48" height="48"/><rect x="360" y="186" width="48" height="48"/><rect x="408" y="186" width="48" height="48"/>
  <rect x="120" y="234" width="48" height="48"/><rect x="168" y="234" width="48" height="48"/><rect x="216" y="234" width="48" height="48"/><rect x="264" y="234" width="48" height="48"/><rect x="312" y="234" width="48" height="48"/><rect x="360" y="234" width="48" height="48"/><rect x="408" y="234" width="48" height="48"/></g>
  <text x="250" y="321" font-family="Arial,sans-serif" font-size="22" fill="#183153">4 rows × 7 squares = 28 square units</text>
</svg>
