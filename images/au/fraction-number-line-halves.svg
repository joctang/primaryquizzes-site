<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" role="img" aria-labelledby="title desc"><title id="title">Number line from zero to two in halves</title><desc id="desc">A horizontal number line from 0 to 2 with equal intervals of one half. Whole numbers 0, 1 and 2 are labelled.</desc><path d="M50 75H710" stroke="#263238" stroke-width="4"/><path d="M50 55V95M215 65V85M380 55V95M545 65V85M710 55V95" stroke="#263238" stroke-width="3"/><path d="M700 67L715 75L700 83" fill="none" stroke="#263238" stroke-width="4"/><g fill="#263238" font-family="Arial,sans-serif" font-size="22" text-anchor="middle"><text x="50" y="125">0</text><text x="380" y="125">1</text><text x="710" y="125">2</text></g></svg>