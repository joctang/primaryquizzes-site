<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" role="img" aria-labelledby="title desc">
  <title id="title">School map on a first-quadrant coordinate grid</title>
  <desc id="desc">A coordinate grid from zero to six on both axes. The library is at (2, 4), the oval at (5, 2), the hall at (3, 1), and the garden at (1, 5).</desc>
  <rect width="560" height="410" rx="18" fill="#f8fafc"/>
  <g stroke="#cbd5e1" stroke-width="1.5">
    <path d="M90 340V70M135 340V70M180 340V70M225 340V70M270 340V70M315 340V70M360 340V70"/>
    <path d="M90 340H360M90 295H360M90 250H360M90 205H360M90 160H360M90 115H360M90 70H360"/>
  </g>
  <g stroke="#16324f" stroke-width="3" fill="none"><path d="M90 340H390M90 340V48"/><path d="M390 340l-10-6v12zM90 48l-6 10h12z" fill="#16324f"/></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#334155" text-anchor="middle"><text x="90" y="365">0</text><text x="135" y="365">1</text><text x="180" y="365">2</text><text x="225" y="365">3</text><text x="270" y="365">4</text><text x="315" y="365">5</text><text x="360" y="365">6</text>
    <text x="70" y="345">0</text><text x="70" y="300">1</text><text x="70" y="255">2</text><text x="70" y="210">3</text><text x="70" y="165">4</text><text x="70" y="120">5</text><text x="70" y="75">6</text>
    <text x="240" y="395" font-size="17">x</text><text x="30" y="195" font-size="17" transform="rotate(-90 30 195)">y</text></g>
  <g fill="#e9a858" stroke="#9a5b14" stroke-width="2"><circle cx="180" cy="160" r="8"/><circle cx="315" cy="250" r="8"/><circle cx="225" cy="295" r="8"/><circle cx="135" cy="115" r="8"/></g>
  <g font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#16324f"><text x="192" y="153">Library</text><text x="327" y="245">Oval</text><text x="237" y="290">Hall</text><text x="147" y="110">Garden</text></g>
</svg>
