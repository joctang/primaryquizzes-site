<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" role="img" aria-labelledby="title desc">
<title id="title">Measuring jug at 300 millilitres</title><desc id="desc">A clear measuring jug marked from zero to 500 millilitres in 100 millilitre steps. The liquid reaches 300 millilitres.</desc>
<rect width="420" height="340" rx="18" fill="#fff"/>
<path d="M145 48 L255 48 L245 290 Q200 310 155 290 Z" fill="#f8fbfd" stroke="#486273" stroke-width="4"/>
<path d="M154 148 L246 148 L241 285 Q200 299 160 285 Z" fill="#83c8e8" opacity=".85"/>
<path d="M155 148 Q200 141 245 148" fill="none" stroke="#246e91" stroke-width="4"/>
<path d="M255 85 Q315 90 290 145 Q278 162 249 156" fill="none" stroke="#486273" stroke-width="5"/>
<g stroke="#26354a" stroke-width="3" fill="#26354a" font-family="Arial,sans-serif" font-size="17">
<line x1="135" y1="280" x2="180" y2="280"/><text x="120" y="286" text-anchor="end" stroke="none">0</text>
<line x1="135" y1="236" x2="180" y2="236"/><text x="120" y="242" text-anchor="end" stroke="none">100</text>
<line x1="135" y1="192" x2="180" y2="192"/><text x="120" y="198" text-anchor="end" stroke="none">200</text>
<line x1="135" y1="148" x2="180" y2="148"/><text x="120" y="154" text-anchor="end" stroke="none">300</text>
<line x1="135" y1="104" x2="180" y2="104"/><text x="120" y="110" text-anchor="end" stroke="none">400</text>
<line x1="135" y1="60" x2="180" y2="60"/><text x="120" y="66" text-anchor="end" stroke="none">500</text>
</g>
<text x="205" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#26354a">millilitres (mL)</text>
</svg>

