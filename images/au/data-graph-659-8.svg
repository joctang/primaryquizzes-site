<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 232" role="img" aria-labelledby="title">
  <title id="title">Recycling by material</title>
  <rect width="640" height="232" rx="16" fill="#fff"/>
  <text x="24" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">Recycling by material</text>
  <text x="24" y="116" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e3a5f">Plastic</text>
  <rect x="220" y="95" width="290" height="30" rx="7" fill="#287d8e"/>
  <text x="520" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1e3a5f">30 kg</text>
  <text x="24" y="168" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e3a5f">Glass</text>
  <rect x="220" y="147" width="193" height="30" rx="7" fill="#e09f3e"/>
  <text x="423" y="168" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1e3a5f">20 kg</text>
  <text x="24" y="220" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e3a5f">Paper</text>
  <rect x="220" y="199" width="242" height="30" rx="7" fill="#5f8d4e"/>
  <text x="472" y="220" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1e3a5f">25 kg</text>
</svg>
